name: PowerShell Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  parse-and-analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON config
        shell: pwsh
        run: |
          Get-Content -Raw -Encoding UTF8 .\WinServerSetup.config.json | ConvertFrom-Json | Out-Null
          Write-Host "WinServerSetup.config.json is valid JSON."

      - name: Parse-check all *.ps1
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $bad++
              Write-Host "::error file=$($_.FullName)::Parse errors:"
              $errors | ForEach-Object {
                Write-Host ("::error file={0},line={1},col={2}::{3}" -f $_.Extent.File, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
            } else {
              Write-Host "OK $($_.FullName)"
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize | Out-Host
            exit 1
          }
          Write-Host "PSScriptAnalyzer found no Error-severity issues."
